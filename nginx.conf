# Rate limiting zone
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # CSP header removed - handled by Nginx Proxy Manager

    # Compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    
    # Block common XSS/injection patterns
    if ($request_uri ~* "(javascript:|<script|<xss|domxss|execution|onload=|onerror=)") {
        return 403;
    }
    
    # Apply rate limiting
    limit_req zone=general burst=20 nodelay;

    # Cache hashed static assets aggressively
    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache media/font assets
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|avif|ico|mp4|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Ensure index is always revalidated
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}